<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Browser</title>
  <link rel="stylesheet" href="../../assets/css/tailwind.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="m-0 p-0 overflow-hidden h-screen theme-light">

  <div class="flex flex-col h-screen w-screen">

    <!-- Hover target for revealing an auto-hidden toolbar. Explicitly
         no-drag: the drag bar's -webkit-app-region:drag can itself swallow
         regular mouse events, so this can't just be "hover the drag bar". -->
    <div id="toolbar-reveal-strip" class="toolbar-reveal-strip"></div>

    <!-- Drag Bar -->
    <div id="drag-bar" class="drag-bar h-8 w-full flex items-center justify-between px-3.5">
      <div class="flex gap-2">
        <button id="close-btn" class="window-btn window-btn-close" title="Close">
          <svg viewBox="0 0 12 12" width="10" height="10"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="minimize-btn" class="window-btn" title="Minimise">
          <svg viewBox="0 0 12 12" width="10" height="10"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="maximize-btn" class="window-btn" title="Maximise">
          <svg viewBox="0 0 12 12" width="10" height="10"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
      </div>
      <div class="flex-1"></div>
    </div>

    <!-- Toolbar, bookmarks bar and tabs bar, grouped so they can be
         auto-hidden together (Settings > Appearance) -->
    <div id="browser-chrome">

    <!-- Toolbar -->
    <div class="toolbar h-12 flex items-center gap-1 px-4 border-b border-opacity-20">
      <button id="back-btn" class="toolbar-icon-btn" title="Back">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="forward-btn" class="toolbar-icon-btn" title="Forward">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button id="reload-btn" class="toolbar-icon-btn" title="Reload">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="history-btn" class="toolbar-icon-btn" title="History (Ctrl/Cmd+H)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M5 3 3 5.5"/><path d="M19 3l2 2.5"/></svg>
      </button>
      <button id="downloads-btn" class="toolbar-icon-btn relative" title="Downloads (Ctrl/Cmd+J)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="downloads-indicator" class="downloads-indicator hidden"></span>
      </button>

      <div class="flex-1 mx-2 relative">
        <input type="text" id="address-bar" placeholder="mi://newtab or https://example.com" class="w-full px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" autocomplete="off">
        <div id="address-suggestions" class="address-suggestions hidden"></div>
      </div>

      <button id="pin-btn" class="toolbar-icon-btn" title="Pin this page to the bookmarks bar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button id="pip-btn" class="toolbar-icon-btn hidden" title="Mini player">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><rect x="11" y="12" width="9" height="7" rx="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="site-menu-btn" class="toolbar-icon-btn" title="Mi &middot; privacy for this site">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="14.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="15" r="0.9" fill="currentColor" stroke="none"/></svg>
      </button>
      <span id="toolbar-clock" class="toolbar-clock hidden"></span>
      <button id="passwords-btn" class="toolbar-icon-btn" title="Passwords">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button id="menu-btn" class="toolbar-icon-btn relative" title="Menu">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span id="update-indicator" class="downloads-indicator hidden" title="Update available"></span>
      </button>
    </div>

    <!-- Mi site menu popover -->
    <div id="site-menu-popover" class="site-menu-popover hidden">
      <p class="text-xs font-semibold opacity-60 uppercase tracking-wide mb-1">Mi &middot; this site</p>
      <p id="site-menu-host" class="text-sm font-semibold mb-1 truncate"></p>
      <p id="site-menu-cookie-count" class="text-xs opacity-60 mb-3"></p>

      <label class="flex items-start gap-3 cursor-pointer mb-3">
        <input type="checkbox" id="site-menu-eat-cookies-toggle" class="w-4 h-4 mt-0.5">
        <span class="text-sm">Let Eat My Cookies sweep this site</span>
      </label>

      <button id="site-menu-clear-cookies-btn" class="w-full px-3 py-2 rounded-lg text-sm font-semibold border-2 hover:opacity-80 transition">Clear cookies for this site now</button>
    </div>

    <!-- Bookmarks bar -->
    <div id="bookmarks-bar" class="bookmarks-bar h-9 flex items-center gap-1 px-2 overflow-x-auto border-b border-opacity-20 hidden"></div>

    <!-- Tabs Bar -->
    <div id="tabs-container" class="tabs-bar h-10 flex items-center gap-1 px-2 overflow-x-auto border-b border-opacity-20">
      <button id="new-tab-btn" class="px-3 h-8 rounded-t text-sm font-semibold hover:opacity-75 transition">+</button>
    </div>

    </div><!-- /#browser-chrome -->

    <!-- Content Area -->
    <div id="webview-container" class="flex-1 overflow-hidden relative">
      <div id="find-bar" class="find-bar site-menu-popover hidden">
        <input type="text" id="find-input" placeholder="Find in page" autocomplete="off">
        <span id="find-matches" class="find-matches"></span>
        <button id="find-prev-btn" class="find-btn" title="Previous match">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <button id="find-next-btn" class="find-btn" title="Next match">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <button id="find-close-btn" class="find-btn" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
